name: Salesforce CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install latest Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      # 3. Authenticate Target Org (FIXED)
      - name: Authenticate Target Org
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a targetOrg -s

      # 4. Validate Deployment (Dry Run)
      - name: Validate Deployment (Dry Run)
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org targetOrg \
            --dry-run \
            --wait 10

      # 5. Deploy to Target Org
      - name: Deploy to Target Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org targetOrg \
            --wait 10

      # 6. Run Apex Tests
      - name: Run Apex Tests
        run: |
          sf apex test run \
            --target-org targetOrg \
            --wait 10 \
            --result-format human
