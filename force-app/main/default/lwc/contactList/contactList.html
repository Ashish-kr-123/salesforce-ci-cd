<template>
    <template if:true={contacts}>
        <lightning-card title = "Contact list">
            <ul>
                <template for:each={contacts} for:item="contact">
                    <li key={contact.Id}>
                        {contact.Name} - {contact.Email}
                    </li>
                </template>
            </ul>
        </lightning-card>
    </template>
    <template if:true={error}>
        <lightning-card title = "Error">
            <p>{error.body.message}</p>
        </lightning-card>
    </template>
</template>
