<template>
    <lightning-card title="Create Contact" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <lightning-input type="text" 
                label="First Name" 
                name="firstName" 
                value={firstName} 
                onchange={handleInputChange}>
            </lightning-input>

            <lightning-input type="text" 
                label="Last Name" 
                name="lastName" 
                value={lastName}
                onchange={handleInputChange}>
            </lightning-input>

            <lightning-input type="email" 
                label="Email" 
                name="email" 
                value={email}
                onchange={handleInputChange}>
            </lightning-input>

            <lightning-button 
                label="Create Contact" 
                variant="brand" 
                onclick={handleSubmit}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card> 
</template>
