<!-- customCreateAccount.html -->
<template>
  <lightning-card title="Create Account (Custom)">
        <div class="slds-p-around-medium">
            <lightning-input
                name="accName"
                label="Account Name"
                value={accName}
                onchange={handleInputChange}>
            </lightning-input>
            <lightning-input
                name="industry"
                label="Industry"
                value={industry}
                onchange={handleInputChange}>
            </lightning-input>
            <lightning-input
                name="revenue"
                label="Annual Revenue"
                type="number"
                value={annualRevenue}
                onchange={handleInputChange}>
            </lightning-input>
            <lightning-button 
                variant="brand" 
                label="Create Account" 
                onclick={handleCreate}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
